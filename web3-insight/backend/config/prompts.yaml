# Theme definitions and prompt templates
# Each theme has: metadata + keyword_prompt + article_prompt
# Template variables: {{.Keyword}}, {{.ExistingKeywords}}, {{.Count}}, {{.BatchNumber}}

themes:
  # =============================================
  # 基础知识类 (Foundational Knowledge)
  # =============================================
  - id: "web3_basics"
    name: "Web3基础知识"
    category: "基础知识"
    description: "区块链、智能合约、共识机制等Web3核心概念"
    sort_order: 1
    keyword_prompt: |
      Generate {{.Count}} unique keywords for beginner-friendly Web3 educational articles.

      **Scope**: Blockchain fundamentals, smart contracts, consensus mechanisms, wallets,
      Layer1/Layer2, tokenomics, DAOs, NFTs, Web3 infrastructure.

      **Ordering**: Start from the most fundamental concepts (what is blockchain, what is
      a wallet) and progress to more advanced topics (MEV, account abstraction).
      A reader should be able to read articles in this order and build knowledge progressively.

      **Excluded keywords** (MUST NOT duplicate):
      {{.ExistingKeywords}}

      **Rules**:
      - Return ONLY a JSON array: ["keyword1", "keyword2", ...]
      - Each keyword: 2-6 words, Chinese or English
      - Be EXHAUSTIVE — cover every fundamental Web3 concept you can think of
      - Simple → complex ordering is critical
      - NO overlap with excluded keywords

      **Anti-Duplication** (CRITICAL):
      - Each keyword MUST target a genuinely DISTINCT topic that would produce a different article
      - NEVER generate semantic duplicates — keywords that cover the same concept in different words
      - BAD examples (these are duplicates): "区块链的基本原理" vs "什么是区块链", "加密钱包入门" vs "如何使用加密钱包", "共识机制概述" vs "共识机制是什么"
      - GOOD examples (these are distinct): "工作量证明(PoW)", "权益证明(PoS)", "委托权益证明(DPoS)" — each covers a different mechanism
      - Cover diverse angles: specific technologies, mechanisms, use cases, comparisons, security aspects, ecosystem tools
      - If a concept was already covered, do NOT rephrase it — find a NEW concept instead

      Output the JSON array directly without any additional text.

    article_prompt: |
      Write a comprehensive educational article about: "{{.Keyword}}"

      **Target Audience**: Complete beginners with NO prior knowledge of this topic.

      **Content Requirements**:
      - Purpose: Educational — help readers LEARN and UNDERSTAND from scratch
      - Be CONCRETE: Use real-world analogies, specific examples, practical scenarios
      - NO assumptions: Explain every concept as if the reader has never heard of it
      - If this builds on simpler concepts, briefly recap them before diving deeper
      - Language: Chinese (中文)
      - Technical terms: Use "English (中文)" format, e.g., "Smart Contract (智能合约)"
      - Length: 1500-2500 words

      **Structure** (use clear Markdown headings):
      - 引言: Hook the reader, explain why this topic matters
      - 核心概念: Break down the topic into digestible pieces
      - 工作原理: How does it actually work? Use analogies
      - 实际应用: Real examples and use cases
      - 常见误区: Common misconceptions to avoid
      - 总结: Key takeaways

      **Formatting**:
      - Use ## for main sections, ### for subsections
      - Use bullet points and numbered lists for clarity
      - Bold key terms on first introduction
      - Add a horizontal rule (---) between major sections
      - Use > blockquotes for important tips or warnings

      **Research**: Use WebFetch if you need the latest information or accurate data.

      **标题要求**：简洁清晰，直接使用关键词或关键词的简短描述作为标题。不要使用社交媒体风格的长标题、不要加副标题、不要使用冒号分隔的标题格式。例如：关键词是"智能合约"，标题就是"智能合约"或"什么是智能合约"。

      **OUTPUT FORMAT** (use these exact delimiters):

      ===TITLE_START===
      Concise keyword-based title in Chinese (e.g. "智能合约" or "什么是智能合约")
      ===TITLE_END===
      ===CONTENT_START===
      Full Markdown content here
      ===CONTENT_END===
      ===SUMMARY_START===
      80-120 word summary in Chinese
      ===SUMMARY_END===

      IMPORTANT: Use exactly these delimiter tags. No other format.

