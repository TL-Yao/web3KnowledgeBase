  # =============================================
  # 历史事件类 (Historical Events)
  # =============================================
  - id: "crypto_history"
    name: "加密行业重大事件"
    category: "历史事件"
    description: "改变行业走向的重大事件、黑客攻击、监管里程碑"
    sort_order: 20
    keyword_prompt: |
      Generate {{.Count}} unique keywords about significant events in crypto/Web3 history.

      **Scope**: Major hacks (Mt. Gox, The DAO, FTX collapse, Terra/Luna crash),
      regulatory milestones (Bitcoin ETF approval, China ban, MiCA),
      technological milestones (Ethereum Merge, Bitcoin halving events, Lightning Network),
      market events (2017 ICO boom, 2021 DeFi summer, NFT mania),
      notable court cases (Ripple vs SEC, SBF trial),
      protocol incidents (Curve exploit, Wormhole hack, Ronin bridge hack).

      **Ordering**: Chronological — earliest events first, most recent last.

      **Excluded keywords**:
      {{.ExistingKeywords}}

      **Rules**:
      - Return ONLY a JSON array: ["keyword1", "keyword2", ...]
      - Each keyword: 3-8 words, should clearly identify the event
      - Include the year if helpful for disambiguation
      - Be EXHAUSTIVE — every significant event
      - NO overlap with excluded keywords

      **Anti-Duplication** (CRITICAL):
      - Each keyword MUST identify a genuinely DISTINCT historical event
      - NEVER generate semantic duplicates — keywords that describe the same event differently
      - BAD examples (these are duplicates): "FTX的崩溃" vs "FTX破产事件", "Terra Luna崩盘" vs "UST脱锚危机"
      - GOOD examples (these are distinct): "2014年Mt.Gox破产", "2016年The DAO攻击", "2022年FTX崩溃" — each is a different event
      - Use specific event names with dates, not generic descriptions of the same incident
      - If an event was already covered, do NOT rephrase it — find a NEW event instead

      Output the JSON array directly without any additional text.

    article_prompt: |
      Write a comprehensive historical account of: "{{.Keyword}}"

      **Angle**: Full context journalism — cause, event, consequence.

      **Content Requirements**:
      - Background: What was the state of the industry before this event?
      - Build-up: What led to this event? Warning signs? Key players?
      - The event itself: What exactly happened? Timeline of events
      - Immediate aftermath: Market reaction, community response
      - Long-term impact: How did this change the industry? New regulations? New tech?
      - Lessons learned: What should people take away from this?
      - Language: Chinese (中文), terms in "English (中文)" format
      - Length: 2000-3000 words

      **Structure**:
      - 引言: Why this event matters
      - 背景: Industry context before the event
      - 事件经过: Detailed chronological account
      - 影响与后果: Immediate and long-term consequences
      - 行业反思: What the industry learned
      - 总结

      **Formatting**: ## sections, ### subsections, bold terms, ---, > blockquotes
      **Important**: Be factual. Use specific dates, numbers, names. No speculation.

      **Research**: Use WebFetch for accurate dates, amounts, and outcomes.

      **标题要求**：简洁清晰，直接使用事件名称作为标题。不要使用社交媒体风格的长标题、不要加副标题、不要使用冒号分隔的标题格式。例如：关键词是"Mt. Gox事件"，标题就是"Mt. Gox事件"。

      **OUTPUT FORMAT**:
      ===TITLE_START===
      Concise event-name title in Chinese
      ===TITLE_END===
      ===CONTENT_START===
      Full Markdown content
      ===CONTENT_END===
      ===SUMMARY_START===
      80-120 word summary in Chinese
      ===SUMMARY_END===

