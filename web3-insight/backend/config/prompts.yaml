  # =============================================
  # 进阶类 (Advanced / Deep-Dive)
  # =============================================
  - id: "advanced_tech"
    name: "进阶技术深度解析"
    category: "进阶"
    description: "前沿技术方案的深度分析：解决了什么问题、是否成功、为什么"
    sort_order: 10
    keyword_prompt: |
      Generate {{.Count}} unique keywords about advanced Web3/blockchain technical solutions.

      **Scope**: Zero-knowledge proofs (zkSNARKs, zkSTARKs, Plonk), rollup architectures
      (optimistic vs zk), data availability (EIP-4844, Celestia), account abstraction (ERC-4337),
      cross-chain bridges, MEV, PBS (proposer-builder separation), restaking,
      modular blockchains, intent-based architectures, FHE, MPC wallets,
      parallel execution (Monad, Sei), alternative VMs (Move, Cairo, Fuel).

      **Ordering**: Group by problem domain, within each domain go from the problem statement
      to specific solutions.

      **Excluded keywords**:
      {{.ExistingKeywords}}

      **Rules**:
      - Return ONLY a JSON array: ["keyword1", "keyword2", ...]
      - Each keyword: 2-6 words, Chinese or English
      - Focus on SPECIFIC technical solutions, not generic concepts
      - Include both successful and failed/abandoned approaches
      - NO overlap with excluded keywords

      **Anti-Duplication** (CRITICAL):
      - Each keyword MUST target a genuinely DISTINCT technology or solution
      - NEVER generate semantic duplicates — keywords that cover the same topic differently
      - BAD examples (these are duplicates): "零知识证明技术" vs "什么是零知识证明", "跨链桥安全" vs "跨链桥的安全问题"
      - GOOD examples (these are distinct): "zkSNARKs", "zkSTARKs", "Plonk证明系统" — each covers a different ZK scheme
      - Prefer naming specific implementations, protocols, or EIPs over generic categories
      - If a concept was already covered, do NOT rephrase it — find a NEW concept instead

      Output the JSON array directly without any additional text.

    article_prompt: |
      Write an in-depth analysis article about: "{{.Keyword}}"

      **Angle**: Evaluate this technology/solution critically. Don't just explain — analyze.

      **Content Requirements**:
      - What specific problem does this solve? Why was the old way insufficient?
      - How does the solution work technically? (explain clearly, not superficially)
      - Did it succeed? Is it still actively used/developed?
      - If it succeeded: why? What made it work? Who adopted it?
      - If it failed or lost popularity: why? What replaced it?
      - What are the tradeoffs? Nothing is free — what did it sacrifice?
      - Language: Chinese (中文)
      - Technical terms: "English (中文)" format
      - Length: 2000-3000 words

      **Structure**:
      - 引言: The problem this exists to solve
      - 技术原理: How it works (diagrams described in text if helpful)
      - 发展现状: Current adoption, key metrics, ecosystem
      - 优势与局限: Honest assessment of tradeoffs
      - 竞争格局: Alternatives and how they compare
      - 前景展望: Is this the future, a stepping stone, or a dead end?
      - 总结

      **Formatting**:
      - ## for main sections, ### for subsections
      - Bullet points, numbered lists
      - Bold key terms, --- between sections
      - > blockquotes for key insights
      - Use comparison tables (markdown) where appropriate

      **Research**: Use WebFetch for latest data, TVL, adoption metrics, recent developments.

      **标题要求**：简洁清晰，直接使用关键词或关键词的简短描述作为标题。不要使用社交媒体风格的长标题、不要加副标题、不要使用冒号分隔的标题格式。例如：关键词是"零知识证明"，标题就是"零知识证明"或"零知识证明技术解析"。

      **OUTPUT FORMAT**:

      ===TITLE_START===
      Concise keyword-based title in Chinese
      ===TITLE_END===
      ===CONTENT_START===
      Full Markdown content
      ===CONTENT_END===
      ===SUMMARY_START===
      80-120 word summary in Chinese
      ===SUMMARY_END===

