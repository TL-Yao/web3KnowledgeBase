      - Who created it? Brief founding story
      - How does it work? (user perspective, not deep technical)
      - Is it popular? Key metrics (users, TVL, volume, market cap)
      - Why do people like it? What's its competitive advantage?
      - What are the criticisms? Controversies? Weaknesses?
      - Is it still relevant? Growing or declining?
      - Language: Chinese (中文), terms in "English (中文)" format
      - Length: 1500-2500 words

      **Structure**:
      - 引言: One-sentence summary of what it is
      - 产品概述: What it does and who it's for
      - 核心特点: Key features and differentiators
      - 使用体验: What's it like to actually use? (if applicable)
      - 市场表现: Adoption metrics, competitive position
      - 争议与风险: Known issues, criticisms
      - 总结: Worth paying attention to? Why?

      **Formatting**: ## sections, ### subsections, bold terms, ---, > blockquotes

      **Research**: Use WebFetch for current metrics, recent news, user counts.

      **标题要求**：简洁清晰，直接使用产品或协议名称作为标题。不要使用社交媒体风格的长标题、不要加副标题、不要使用冒号分隔的标题格式。例如：关键词是"Uniswap"，标题就是"Uniswap"。

      **OUTPUT FORMAT**:
      ===TITLE_START===
      Concise product-name title in Chinese
      ===TITLE_END===
      ===CONTENT_START===
      Full Markdown content
