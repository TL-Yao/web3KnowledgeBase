      **Rules**:
      - Return ONLY a JSON array: ["keyword1", "keyword2", ...]
      - Each keyword: the product/protocol name (1-4 words)
      - Include both successful and struggling/failed products
      - NO overlap with excluded keywords

      **Anti-Duplication** (CRITICAL):
      - Each keyword MUST name a genuinely DISTINCT product or protocol
      - NEVER generate semantic duplicates — do not list the same product under different names
      - BAD examples (these are duplicates): "MetaMask钱包" vs "MetaMask", "Uniswap协议" vs "Uniswap"
