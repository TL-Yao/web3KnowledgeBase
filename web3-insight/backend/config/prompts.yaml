  # =============================================
  # 公司介绍类 (Company Introductions)
  # =============================================
  - id: "notable_companies"
    name: "知名公司与组织"
    category: "公司介绍"
    description: "加密行业的关键公司和组织"
    sort_order: 40
    keyword_prompt: |
      Generate {{.Count}} unique keywords about notable companies and organizations in crypto.

      **Scope**: Exchanges (Binance, Coinbase, Kraken, OKX),
      infrastructure companies (Consensys, Alchemy, Infura, QuickNode),
      investment firms (a16z, Paradigm, Polychain, Galaxy Digital),
      research/analytics (Chainalysis, Nansen, Messari, Glassnode),
      foundations (Ethereum Foundation, Bitcoin Foundation, Solana Foundation),
      custodians (BitGo, Fireblocks, Copper),
      hardware (Ledger, Trezor, Bitmain, MicroBT),
      failed companies (FTX, Three Arrows Capital, Celsius, BlockFi, Voyager),
      TradFi entering crypto (BlackRock, Fidelity, JPMorgan).

      **Ordering**: By significance — most impactful companies first.

      **Excluded keywords**:
      {{.ExistingKeywords}}

      **Rules**:
      - Return ONLY a JSON array: ["keyword1", "keyword2", ...]
      - Each keyword: the company/org name (1-4 words)
      - Include both thriving and failed companies
      - NO overlap with excluded keywords

      **Anti-Duplication** (CRITICAL):
      - Each keyword MUST name a genuinely DISTINCT company or organization
      - NEVER generate semantic duplicates — do not list the same entity under different names
      - BAD examples (these are duplicates): "Binance交易所" vs "Binance", "a16z Crypto" vs "Andreessen Horowitz"
      - Use the most commonly known name (e.g., "a16z" not "Andreessen Horowitz Crypto Fund")
      - If a company was already listed, do NOT add it with a different qualifier — find a NEW company instead

      Output the JSON array directly without any additional text.

    article_prompt: |
      Write a comprehensive company profile of: "{{.Keyword}}"

      **Angle**: Business journalism — who are they, what's their story, are they important?

      **Content Requirements**:
      - What does this company/org do? Core business
      - Founding story: who started it, when, why?
      - Key milestones: major achievements, funding rounds, pivots
      - Business model: how do they make money?
      - Industry position: market share, competitive landscape
      - Controversies: any scandals, regulatory issues, criticism?
      - Current status: thriving, struggling, or defunct? Why?
      - Language: Chinese (中文), terms in "English (中文)" format
      - Length: 1500-2500 words

      **Structure**:
      - 引言: One-line summary
      - 公司概况: What they do and scale
      - 发展历程: Timeline of key events
      - 商业模式: Revenue and strategy
      - 行业地位: Where they stand in the market
      - 争议与挑战: Problems and criticisms
      - 总结: Significance to the industry

      **Formatting**: ## sections, ### subsections, bold terms, ---, > blockquotes

      **Research**: Use WebFetch for current data, recent news, employee counts, revenue.

      **标题要求**：简洁清晰，直接使用公司或组织名称作为标题。不要使用社交媒体风格的长标题、不要加副标题、不要使用冒号分隔的标题格式。例如：关键词是"Coinbase"，标题就是"Coinbase"。

      **OUTPUT FORMAT**:
      ===TITLE_START===
      Concise company-name title in Chinese
      ===TITLE_END===
      ===CONTENT_START===
      Full Markdown content
      ===CONTENT_END===
      ===SUMMARY_START===
      80-120 word summary in Chinese
      ===SUMMARY_END===

