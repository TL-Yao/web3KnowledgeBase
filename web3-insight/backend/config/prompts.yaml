      infrastructure (Chainlink, The Graph, Filecoin, Arweave),
      wallets (MetaMask, Phantom, Ledger, Safe),
      exchanges (Binance, Coinbase, dYdX, Hyperliquid),
      NFT platforms (OpenSea, Blur, Magic Eden),
      L2s (Arbitrum, Optimism, Base, zkSync, StarkNet),
      tools (Etherscan, DefiLlama, Dune Analytics),
      newer protocols (EigenLayer, Celestia, Monad, Berachain).

      **Ordering**: By significance and maturity — most established first, newer projects later.

